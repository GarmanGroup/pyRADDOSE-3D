tier_b_rationale: 'The Monte Carlo and XFEL subprograms follow each electron with
  random numbers whose order depends on its history, so the port is compared with
  them statistically. Each case is run with Runs K on each side, and the means of
  five headline quantities per subprogram are compared by Welch''s t-test. Across
  the corpus the chance of any false alarm is family_alpha, by Bonferroni''s correction
  over every comparison. The seeds are fixed, so a false alarm is not a flaky test:
  it can only appear when a change alters how random numbers are used. detectable_bias
  gives, per case and quantity, the bias relative to the mean that its test catches
  with the stated power: about 1.9 times the run-to-run spread each case.yaml records,
  with 20 runs a side. The other quantities, and the variance ratio, are reported
  but not tested. The reference''s values are as RADDOSE-3D writes them, %f in its
  files and %.3f on stdout. Rounding adds nothing to a mean, and to a variance (step^2
  / 12) / spread^2: under 2% for every tested quantity, the most for ions per atom,
  which %f leaves three significant figures.'
quantised_quantities:
- dose_threshold
- tad
- dose_contrast
tolerance_rationale:
  tier_A_relative: 'Set by how well conditioned the voxel occupancy test is, not by
    how carefully the port was written. calculateCrystalOccupancy decides membership
    by ray parity, so a voxel whose centre lies exactly on a face can go either way,
    and a crystal face aligned with the voxel grid puts a whole plane of them in that
    position. Moving every mesh vertex by one ulp moves the reported sums by as much
    as 9.3e-2 (baseline); the port''s disagreement with the reference is at worst
    6.5e-5 (composition-cif, diffraction_efficiency). Java cannot reproduce itself
    to better than this either: Math.cos and Math.sin are not required to be bit-reproducible
    across JVMs.'
  tier_A_quantised_quantities_relative: 'These three are quantised and cannot take
    a value between two rungs. dose_threshold is a dose some voxel actually has, so
    it moves in steps of the dose histogram''s bin gap -- median 1e-4 to 3e-3 relative
    across the corpus. tad and dose_contrast divide by a count of voxels above the
    threshold, so they move in steps of one voxel in about five hundred, 2e-3. Every
    disagreement measured is exactly one step: the adjacent histogram bin, or one
    voxel. 5e-3 is a couple of steps.'
  histogram_percentage_points: Summary.txt's dose histogram counts voxels, so a bin
    moves in steps of one voxel -- about 0.2 percentage points in these crystals --
    whenever a voxel's dose sits close to a bin edge. Worst 0.40 against the reference
    (two voxels) and 0.42 against the port itself when every angle moves by one ulp.
notes: Reference values are produced by the Java implementation on the JVM named above.
  The same Java code varies by ~1e-6 between JVMs, so regenerate deliberately and
  review the diff.
excluded:
  AbsCoefCalc RDV2: shells out to an unshipped binary
caveats:
  AbsCoefCalc EXPSM (CIF): 'Covered by case 034, but note CoefCalcFromCIF crashes
    when the last token of _chemical_formula_sum is a bare single-letter symbol (urea''s
    ''C H4 N2 O'' fails). COD 1008123 was chosen because its formula ends in ''Sb2''.
    A protein mmCIF will not work at all: this is the small-molecule route and needs
    _chemical_formula_sum.'
keyword_notes:
  AbsCoefCalc EXP: PDB-based composition. The grammar token *named* PDB matches the
    literal 'EXP', so 'AbsCoefCalc PDB' can never parse.
  AbsCoefCalc EXPSM: CIF-based composition. The token named CIF matches the literal
    'EXPSM'.
