microed_tolerance_rationale: 'MicroED is deterministic, and the port agrees with the
  Java to the last printed digit or two: the productive count to 3.1e-14 (case 131),
  the inelastic mean free path to 5.9e-15, the elastic to 4.0e-16, and every slice
  exactly. What remains comes from summing the elements in atomic-number order, where
  the Java iterates a HashSet. The doses, the elastic counts and the elastic mean
  free path are allowed 15x or more, for other platforms'' maths libraries. The inelastic
  model is less well conditioned: moving each pow, log and exp it calls by an ulp
  at random moves the inelastic mean free path by up to 8.3e-9 (case 134), and the
  productive count, and with it the information coefficient, by up to 1.8e-8 (case
  125). Windows'' maths library moves case 122''s inelastic mean free path by 1.2e-11.
  Everything that model feeds is allowed 1e-7. The grid searches'' answers must be
  exact, and none of this moves them.'
array_tolerance_rationale: 'Set by the same rule as the summary tolerances: the worst
  disagreement with the reference across the corpus, with headroom, justified because
  it is smaller than the port''s disagreement with itself when every rotation angle
  is moved by one ulp. Statistics that average over the crystal agree to 7.1e-5 and
  share the summary''s 1e-4. The rest are dominated by voxels whose centres lie exactly
  on a crystal face: at some angles their path length through the crystal flips between
  zero and the full chord on the last bit of a cosine. The port rounds its cosines
  correctly, so it gives the same on every platform; Math.cos is not bit-reproducible
  across JVMs, and at 23 of the corpus''s 171 angles the reference''s sine or cosine
  is an ulp away. Per-image fluence maxima are the most exposed because the brightest
  voxel in an image is one on the upstream face. How much a flip matters scales with
  absorption: the worst case is the antimony CIF crystal, at 3.0e-2 against the reference
  and 4.4e-2 against itself. The stills turn to 45 degrees, whose sine and cosine
  the port and the reference both round correctly, and agree to 5e-8 on every statistic
  -- the control showing the disagreement is the knife edge and not the physics: an
  ulp on their angle moves them by 1e-3. Counts of voxels, images and exposed voxels
  are exact. The five RDE columns of DWDs are compared absolutely: they are fractions
  of 1 that fall to exp(-40) on the antimony crystal, where any relative difference
  is the knife edge in the DWD multiplied by DWD over the 1/e dose. Worst 1.7e-4 against
  the reference, on the 6 keV beam, and 8.1e-4 against itself; the stills agree to
  2e-15. DoseState.R is compared voxel by voxel, which is the knife edge undiluted:
  worst 8.7e-3 against the reference and 3.0e-2 against itself, both on the antimony
  crystal, so it shares the fluence maxima''s 5e-2. The weighted RDE is amplified
  the same way under the Leal model, whose Gaussian term makes log RDE fall by 2 gamma^2
  D per MGy: worst 5.9e-4 against the reference, where the efficiency is down to 1e-4,
  and 3.0e-3 against itself. Escape modelling does the same to each image''s maximum
  dose, which is one voxel''s: a photoelectron''s deposit lands in the voxel its track
  position rounds to, and a last-bit difference in a cosine moves it to the next.
  Worst 1.5e-4 against the reference, and an ulp on the angles moves it by up to 9.8e-4,
  so VoxelDose/max goes from 1e-4 to 5e-4.'
