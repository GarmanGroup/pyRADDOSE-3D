array_tolerance_rationale: 'Set by the same rule as the summary tolerances: the worst
  disagreement with the reference across the corpus, with headroom, justified because
  it is smaller than the port''s disagreement with itself when every rotation angle
  is moved by one ulp. Statistics that average over the crystal agree to 5e-5 and
  share the summary''s 1e-4. The rest are dominated by voxels whose centres lie exactly
  on a crystal face: at some angles their path length through the crystal flips between
  zero and the full chord on the last bit of a cosine, and Math.cos is not bit-reproducible
  across JVMs. Per-image fluence maxima are the most exposed because the brightest
  voxel in an image is one on the upstream face. How much a flip matters scales with
  absorption: the worst case is the antimony CIF crystal, at 3.6e-2 against the reference
  and 4.8e-2 against itself. The stills, which do not rotate, and the AngleP 45 case,
  which has no face on a voxel plane, agree to about 1e-8 on every statistic -- the
  control showing the disagreement is the knife edge and not the physics. Counts of
  voxels, images and exposed voxels are exact. The five RDE columns of DWDs are compared
  absolutely: they are fractions of 1 that fall to exp(-40) on the antimony crystal,
  where any relative difference is the knife edge in the DWD multiplied by DWD over
  the half dose. Worst 2.6e-4 against the reference, on that crystal, and 7.9e-4 against
  itself; the stills agree to 2e-15.'
quantised_quantities:
- dose_threshold
- tad
- dose_contrast
tolerance_rationale:
  tier_A_relative: 'Set by how well conditioned the voxel occupancy test is, not by
    how carefully the port was written. calculateCrystalOccupancy decides membership
    by ray parity, so a voxel whose centre lies exactly on a face can go either way,
    and a crystal face aligned with the voxel grid puts a whole plane of them in that
    position. Moving every mesh vertex by one ulp moves the reported sums by 1.7e-5
    (rotation-anglep-45) to 9.3e-2 (baseline) -- one to four orders of magnitude more
    than the port''s disagreement with the reference, which is at worst 5e-5. Java
    cannot reproduce itself to better than this either: Math.cos and Math.sin are
    not required to be bit-reproducible across JVMs.'
  tier_A_quantised_quantities_relative: 'These three are quantised and cannot take
    a value between two rungs. dose_threshold is a dose some voxel actually has, so
    it moves in steps of the dose histogram''s bin gap -- median 1e-4 to 3e-3 relative
    across the corpus. tad and dose_contrast divide by a count of voxels above the
    threshold, so they move in steps of one voxel in about five hundred, 2e-3. Every
    disagreement measured is exactly one step: the adjacent histogram bin, or one
    voxel. 5e-3 is a couple of steps.'
  tier_B_relative: Escape modelling consumes random draws in an order a vectorised
    implementation cannot reproduce, so only gross agreement is meaningful.
notes: Reference values are produced by the Java implementation on the JVM named above.
  The same Java code varies by ~1e-6 between JVMs, so regenerate deliberately and
  review the diff.
excluded:
  AbsCoefCalc RDV2: shells out to an unshipped binary
caveats:
  AbsCoefCalc EXPSM (CIF): 'Covered by case 034, but note CoefCalcFromCIF crashes
    when the last token of _chemical_formula_sum is a bare single-letter symbol (urea''s
    ''C H4 N2 O'' fails). COD 1008123 was chosen because its formula ends in ''Sb2''.
    A protein mmCIF will not work at all: this is the small-molecule route and needs
    _chemical_formula_sum.'
keyword_notes:
  AbsCoefCalc EXP: PDB-based composition. The grammar token *named* PDB matches the
    literal 'EXP', so 'AbsCoefCalc PDB' can never parse.
  AbsCoefCalc EXPSM: CIF-based composition. The token named CIF matches the literal
    'EXPSM'.
