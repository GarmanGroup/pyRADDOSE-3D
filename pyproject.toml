# https://peps.python.org/pep-0517/
[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# https://hatch.pypa.io/latest/config/metadata/
[tool.hatch.version]
source = "vcs"

# The version is written into the package when it is built, so importing it
# does not ask importlib.metadata, which took 55 ms, about 40% of the import.
[tool.hatch.build.hooks.vcs]
version-file = "src/pyraddose_3d/_version.py"

# read more about configuring hatch at:
# https://hatch.pypa.io/latest/config/build/
[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]

# https://peps.python.org/pep-0621/
[project]
name = "pyRADDOSE-3D"
dynamic = ["version"]
description = "A Python port of RADDOSE-3D, differentiable with PyTorch where installed"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Josh Dickerson", email = "jdickerson@berkeley.edu" }]
# https://pypi.org/classifiers/
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
# The default install is deliberately NumPy-sized. RADDOSE-3D is intended for
# inclusion in CCP4, whose maintainers already describe space as a pressure
# (Agirre et al. 2023, doi:10.1107/S2059798323003595), and the torch stack
# measures ~570 MB installed against ~31 MB for everything below -- more on
# Linux, where it pulls CUDA toolkit, cuDNN, NCCL and Triton.
#
# See src/pyraddose_3d/backend/_array.py: the numerical core is written
# against the array-API subset NumPy and torch agree on, so both backends run
# the same code and the same conformance corpus.
dependencies = [
    "gemmi",  # structure, CIF and sequence files: CCP4 asks for no bespoke parsers
    "numpy",
    "pydantic",
    "pyyaml",
    "scipy",  # erf, erfinv and the normal quantile; CCP4 ships it already
]

# https://peps.python.org/pep-0621/#dependencies-optional-dependencies
[project.optional-dependencies]
# Gradients. Required for strategy optimisation, not for computing dose.
torch = ["torch"]
# ELSEPA's electron angular tables, 25 MB, which only the Monte Carlo and XFEL
# subprograms read: packages/elsepa-low and packages/elsepa-high.
montecarlo = ["pyraddose-3d-elsepa-low", "pyraddose-3d-elsepa-high"]
# Dose contours drawn as RADDOSE-3D's DoseState.R draws them: pyraddose_3d.plotting.
# 3.7 for shaded surfaces.
plot = ["matplotlib>=3.7"]

[project.urls]
homepage = "https://github.com/GarmanGroup/pyRADDOSE-3D"
repository = "https://github.com/GarmanGroup/pyRADDOSE-3D"

# Entry points
# https://peps.python.org/pep-0621/#entry-points
# same as console_scripts entry point
# [project.scripts]
# pyRADDOSE-3D-cli = "pyraddose_3d:main_cli"

# [project.entry-points."some.group"]
# tomatoes = "pyraddose_3d:main_tomatoes"

# https://peps.python.org/pep-0735/
# setup with `uv sync` or `pip install -e . --group dev`
[dependency-groups]
# torch is in the test group, not in `dependencies`: CI must exercise both
# backends against the same conformance corpus, or they will drift.
# The ELSEPA tables too, so that tests needing them fail rather than skip.
test = [
    "pytest",
    "pytest-cov",
    "torch",
    "matplotlib>=3.7",
    "pyraddose-3d-elsepa-low",
    "pyraddose-3d-elsepa-high",
]
dev = [
    { include-group = "test" },
    "ipython",
    "mypy",
    "types-PyYAML",  # stubs, for mypy
    "pdbpp",  # https://github.com/pdbpp/pdbpp
    "pre-commit-uv",
    "rich",  # https://github.com/Textualize/rich
    "ruff",
]
# The notebooks in docs/examples are executed by nbmake, so an example that
# stops working fails the build instead of misleading a reader.
notebooks = [
    { include-group = "test" },
    "ipykernel>=7.4.0",
    "jupytext>=1.19.6",
    "matplotlib>=3.11.2",
    "nbmake>=1.5.5",
]
# Building the site executes the examples, so it needs what they need.
docs = [
    { include-group = "notebooks" },
    "mkdocs>=1.6.1",
    "mkdocs-jupyter>=0.26.3",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
pyRADDOSE-3D = { workspace = true }
pyraddose-3d-elsepa-low = { workspace = true }
pyraddose-3d-elsepa-high = { workspace = true }

# https://docs.astral.sh/ruff
[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src"]
fix = true
# unsafe-fixes = true

[tool.ruff.lint]
pydocstyle = { convention = "numpy" }
select = [
    "E",    # style errors
    "W",    # style warnings
    "F",    # flakes
    "D",    # pydocstyle
    "D417", # Missing argument descriptions in Docstrings
    "I",    # isort
    "UP",   # pyupgrade
    "C4",   # flake8-comprehensions
    "B",    # flake8-bugbear
    "A001", # flake8-builtins
    "RUF",  # ruff-specific rules
    "TC",   # flake8-type-checking
    "TID",  # flake8-tidy-imports
]
ignore = [
    "D401", # First line should be in imperative mood (remove to opt in)
]

# Pydantic evaluates these classes' annotations at runtime to build the models,
# so the types they name must be real imports, not TYPE_CHECKING-only ones.
[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "pyraddose_3d.models._base.RD3DModel",
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["D", "S"]
"docs/*.py" = ["D", "A"]

# https://docs.astral.sh/ruff/formatter/
[tool.ruff.format]
docstring-code-format = true
skip-magic-trailing-comma = false  # default is false

# https://docs.pytest.org/
[tool.pytest.ini_options]
minversion = "7.0"
addopts = ["--color=yes", "-m", "not slow and not network"]
testpaths = ["tests"]
markers = [
    "slow: long-running test, deselected by default (run with -m slow)",
    "network: downloads from the internet, deselected by default (run with -m network)",
    "conformance: compares against reference output from the Java implementation",
]
# Warnings are errors. Add narrowly-scoped, commented exceptions here rather
# than relaxing this -- see Leopard-EM's pyproject.toml for the pattern.
filterwarnings = ["error"]

# https://mypy.readthedocs.io/en/stable/config_file.html
[tool.mypy]
files = ["src"]
strict = true
disallow_any_generics = false
disallow_subclassing_any = false
show_error_codes = true
pretty = true
plugins = ["pydantic.mypy"]

# # module specific overrides
# [[tool.mypy.overrides]]
# module = ["numpy.*",]
# ignore_errors = true

# https://coverage.readthedocs.io/
[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@overload",
    "except ImportError",
    "raise AssertionError",
    "\\.\\.\\.",
    "raise NotImplementedError()",
    "pass",
]

[tool.coverage.run]
source = ["pyraddose_3d"]

# https://github.com/mgedmin/check-manifest#configuration
# add files that you want check-manifest to explicitly ignore here
# (files that are in the repo but shouldn't go in the package)
[tool.check-manifest]
ignore = [
    ".pre-commit-config.yaml",
    ".ruff_cache/**/*",
    # Written at build time by hatch-vcs, so in every sdist and never in git.
    "src/pyraddose_3d/_version.py",
    "tests/**/*",
    "uv.lock",
]

# https://github.com/crate-ci/typos/blob/master/docs/reference.md
[tool.typos.default]
extend-ignore-identifiers-re = []
